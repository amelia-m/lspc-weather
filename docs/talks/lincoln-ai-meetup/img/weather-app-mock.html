<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#000;font-family:Inter,"Segoe UI",system-ui,sans-serif}
.phone{width:390px;height:760px;text-shadow:0 1px 2px rgba(0,0,0,.35);background:linear-gradient(180deg,#2f6fb8 0%,#4f93d4 55%,#6fb0e4 100%);color:#fff;padding:28px 22px;box-sizing:border-box;position:relative}
.loc{font-size:30px;font-weight:600;text-align:center;letter-spacing:.2px}
.now{font-size:88px;font-weight:200;text-align:center;line-height:1;margin-top:6px}
.cond{text-align:center;font-size:24px;font-weight:500;margin-top:4px}
.hl{text-align:center;font-size:20px;opacity:1;margin-top:2px}
.card{background:rgba(0,0,0,.18);border-radius:16px;padding:12px 14px;margin-top:22px;backdrop-filter:blur(6px)}
.card h4{margin:0 0 8px;font-size:14px;letter-spacing:.6px;text-transform:uppercase;opacity:.95}
.hours{display:flex;justify-content:space-between;font-size:17px;font-weight:500;text-align:center}
.hours div span{display:block}
.hours .t{font-size:24px;margin:6px 0}
.days div{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid rgba(255,255,255,.3);font-size:20px;font-weight:500}
.days div:first-child{border-top:none}
.days .d{width:92px}.days .i{font-size:26px;width:40px}.days .r{display:flex;align-items:center;gap:10px;width:150px;justify-content:flex-end}
.bar{width:80px;height:5px;border-radius:3px;background:linear-gradient(90deg,#7bd1ff,#ffd166,#ff9f43)}
.lo{opacity:.9}
.sat,.sun{font-weight:700}
.sat .d,.sun .d{color:#fff}
.sat, .sun{background:rgba(255,255,255,.2);margin:0 -6px;padding:9px 6px!important;border-radius:10px}
.mock{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:12px;opacity:.9;font-weight:600;letter-spacing:.5px}
</style></head><body><div class="phone">
<div class="loc">Weeping Water</div>
<div class="now">58°</div>
<div class="cond">Partly cloudy</div>
<div class="hl">H: 64°  L: 41°</div>
<div class="card"><h4>Hourly</h4><div class="hours">
<div><span>Now</span><span class="t">⛅</span><span>58°</span></div>
<div><span>9AM</span><span class="t">⛅</span><span>52°</span></div>
<div><span>10AM</span><span class="t">⛅</span><span>55°</span></div>
<div><span>11AM</span><span class="t">🌤️</span><span>59°</span></div>
<div><span>12PM</span><span class="t">☀️</span><span>62°</span></div>
<div><span>1PM</span><span class="t">☀️</span><span>64°</span></div>
</div></div>
<div class="card"><h4>10-day forecast</h4><div class="days">
<div><span class="d">Today</span><span class="i">☀️</span><span class="r"><span class="lo">41°</span><span class="bar"></span><span>64°</span></span></div>
<div><span class="d">Fri</span><span class="i">🌤️</span><span class="r"><span class="lo">39°</span><span class="bar"></span><span>61°</span></span></div>
<div class="sat"><span class="d">Sat</span><span class="i">⛅</span><span class="r"><span class="lo">44°</span><span class="bar"></span><span>68°</span></span></div>
<div class="sun"><span class="d">Sun</span><span class="i">⛅</span><span class="r"><span class="lo">45°</span><span class="bar"></span><span>70°</span></span></div>
<div><span class="d">Mon</span><span class="i">⛅</span><span class="r"><span class="lo">40°</span><span class="bar"></span><span>60°</span></span></div>
</div></div>
<div class="mock">A MOCK-UP FOR A TALK · NOT ANY REAL APP</div>
</div></body></html>
