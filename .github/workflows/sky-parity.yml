name: Sky decode parity

# Daily, and on demand: compare the app's own METAR sky parse, flight
# category and TAF group decode against aviationweather.gov's decoder on
# today's reports, print what api.weather.gov and usairnet said, open
# the Pilots tab's deep links (scripts/pilotLinks.live.ts), and check that
# every SIM part the app cites or quotes still reads as it did when it was
# last read and the SIM page still names the edition it was read in
# (scripts/simText.live.ts). On failure, opens (or comments on) one issue
# per failed check, labelled by it and titled by the failed test, from
# Vitest's JSON report (scripts/liveIssue.ts, src/domain/liveIssue.ts).
# Not part of CI: it needs the network, and the PR suite stays hermetic.
on:
  schedule:
    - cron: '0 13 * * *' # 08:00 CDT / 07:00 CST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compare decoders on today's report
        shell: bash
        run: |
          set -o pipefail
          # The console reporter for the log (the @@parity lines and the
          # decoders' output), the JSON one for the issue a failure opens.
          npx vitest run --config vitest.live.config.ts \
            --reporter=default --reporter=json --outputFile=parity.json 2>&1 | tee parity.log
      # The comparison scripts' @@parity lines feed the #parity page's summary
      # (parity-summary.yml), with the eight a day from comparisons.yml.
      - name: Keep this run's @@parity lines
        if: always()
        shell: bash
        run: |
          if [ -f parity.log ]; then grep -a '@@parity ' parity.log > "parity-${{ github.run_id }}.jsonl" || true; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-${{ github.run_id }}
          path: parity-${{ github.run_id }}.jsonl
          retention-days: 14
          if-no-files-found: ignore
      # A run dispatched on a branch is a trial of that branch's checks and
      # must not open an issue against main.
      - name: Open or update an issue per failed check
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          # One issue per failed check, from the JSON report: its label, a
          # title naming the failed test, and the failure's own message,
          # then the end of the log, which has the decoders' and the
          # checks' own lines. A run the script cannot report on (no
          # node_modules to run it with, a report not written in full)
          # still opens one, under live-checks, rather than kill this step.
          shopt -s nullglob
          if ! npx tsx scripts/liveIssue.ts parity.json "$RUN_URL" issues; then
            mkdir -p issues
            jq -n --arg url "$RUN_URL" --arg date "$(date -u +%Y-%m-%d)" '{
              label: "live-checks",
              description: "A live check failed outside the named checks, or the run failed before they started",
              title: "Live checks: no report of the run could be read",
              body: "The daily live checks failed on \($date), and no report of them could be read: the run failed before they started, or the report was not written in full. Run: \($url)\n\nSee the run for which."
            }' > issues/live-checks.json
          fi
          for f in issues/*.json; do
            label=$(jq -r .label "$f")
            gh label create "$label" --color D93F0B --force --description "$(jq -r .description "$f")"
            {
              jq -r .body "$f"
              if [ -f parity.log ]; then
                echo
                echo '<details><summary>The last 40 lines of the log</summary>'
                echo
                echo '```'
                tail -n 40 parity.log
                echo '```'
                echo '</details>'
              fi
            } > body.md
            # `.[0].number` on an empty list prints the word null, which is a
            # non-empty string; `// empty` prints nothing, which is what -n tests.
            existing=$(gh issue list --label "$label" --state open --json number --jq '.[0].number // empty')
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body-file body.md
            else
              gh issue create --title "$(jq -r .title "$f")" --label "$label" --body-file body.md
            fi
          done
