name: Parity summary

# Daily, and on demand: gather the @@parity lines every comparison run
# uploaded (parity-*.jsonl artifacts from comparisons.yml, eight a day, and
# sky-parity.yml, kept fourteen days)
# and the archived logs of the two-minute sampler that ran to 2026-10-05
# (data/parity/), combine them into public/parity/summary.json with
# scripts/paritySummary.ts, and commit the result to main so the #parity page
# ("How different from other sources") shows it. The archive is what keeps
# the sampler's figures, the arrival timings among them, once its artifacts
# expire; the script drops a record seen twice, so the overlap while both
# exist counts once. A push made with the workflow token does not start other
# workflows, so this one dispatches the Pages deploy itself when the summary
# changed. The arithmetic is in src/domain/paritySummary.ts, pure and tested;
# nothing here grades a source.
#
# Since 2026-10-19 it also keeps the logs: every record in the downloaded
# artifacts that no archive under data/parity/ holds yet goes into
# data/parity/parity-logs-<day>.jsonl.gz (scripts/parityArchive.ts),
# committed with the summary, so the page and later analyses keep each day
# after its artifact expires. Before that, everything after the sampler's
# archive (2026-10-05) was dropping off a day at a time. Since 2026-10-30
# it does the same for the standing surface-wind sampler's records
# (surfacewind-* artifacts from surface-wind-sample.yml, kept thirty days),
# one archive a month, data/parity/surfacewind-<YYYY-MM>.jsonl.gz
# (scripts/surfaceWindArchive.ts); the summary never reads those, the
# weekly ceiling data refresh rebuilds the #wind-errors page from them.
on:
  # When the daily sky-parity run finishes, so its lines are always in:
  # a fixed time after it would race a late or slow run.
  # main only: a trial dispatched on a branch must not feed the page.
  workflow_run:
    workflows: ['Sky decode parity']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  # For the one issue the default-model check may open.
  issues: write

concurrency:
  group: parity-summary
  cancel-in-progress: false

jobs:
  summarise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # Whole history, so the commit can be rebased onto a main that
          # moved during the run (the commit step, since 2026-11-19), as the
          # ceiling refresh does.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download every recent parity artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p logs
          # From runs on main only: a comparison dispatched on a branch is a
          # trial of that branch's scripts, and must not feed the page.
          # Artifacts named parity-<run id> (the comparison runs; until it expires,
          # parity-<run id>-<hour> from the sampler too), not yet expired.
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100&name=" \
            --jq '.artifacts[] | select(.name | startswith("parity-")) | select(.expired | not) | select(.workflow_run.head_branch == "main") | "\(.id) \(.name)"' \
            > artifacts.txt
          # A failed listing fails the run: with `|| true` it read as
          # "downloaded 0 artifacts" and a summary built from the archives
          # alone, to yesterday, was committed and deployed green (the ops
          # review of 2026-11-20).
          count=0
          while read -r id name; do
            [ -z "$id" ] && continue
            gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > "logs/$name.zip" \
              && unzip -o -q "logs/$name.zip" -d logs \
              && rm "logs/$name.zip" \
              && count=$((count + 1)) || echo "could not fetch $name"
          done < artifacts.txt
          echo "downloaded $count artifacts"
          # The comparison-log archives only (logs-to-*, schulze-logs-*,
          # parity-logs-*); data/parity/ also holds forecast archives the
          # summary has no use for, one of them 5.5 MB.
          for f in data/parity/*logs-*.jsonl.gz; do
            [ -e "$f" ] || continue
            gunzip -c "$f" > "logs/archive-$(basename "$f" .gz)"
          done
          ls logs | head -50
      # Keeping the logs must not stop the page updating: a failure here
      # shows on the run, and the summary is still built from the artifacts.
      - name: Archive the records no archive holds yet
        continue-on-error: true
        shell: bash
        run: |
          shopt -s nullglob
          fresh=()
          for f in logs/*.jsonl; do [[ "$(basename "$f")" == archive-* ]] || fresh+=("$f"); done
          [ ${#fresh[@]} -gt 0 ] || { echo "no artifacts to archive"; exit 0; }
          npx tsx scripts/parityArchive.ts --fresh "${fresh[@]}" \
            --archives data/parity/*logs-*.jsonl.gz --out "data/parity/parity-logs-$(date -u +%Y-%m-%d).jsonl.gz"
      - name: Archive the surface-wind sampler's records no archive holds yet
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p swlogs
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100&name=" \
            --jq '.artifacts[] | select(.name | startswith("surfacewind-")) | select(.expired | not) | select(.workflow_run.head_branch == "main") | "\(.id) \(.name)"' \
            > swartifacts.txt || true
          count=0
          while read -r id name; do
            [ -z "$id" ] && continue
            gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > "swlogs/$name.zip" \
              && unzip -o -q "swlogs/$name.zip" -d swlogs \
              && rm "swlogs/$name.zip" \
              && count=$((count + 1)) || echo "could not fetch $name"
          done < swartifacts.txt
          echo "downloaded $count surface-wind artifacts"
          shopt -s nullglob
          fresh=(swlogs/*.jsonl)
          [ ${#fresh[@]} -gt 0 ] || { echo "no surface-wind artifacts to archive"; exit 0; }
          npx tsx scripts/surfaceWindArchive.ts --fresh "${fresh[@]}" \
            --archives data/parity/surfacewind-*.jsonl.gz --out "data/parity/surfacewind-$(date -u +%Y-%m).jsonl.gz"
      # The sampler asks Open-Meteo's default, the HRRR by name and the RRFS
      # by name each run. Open-Meteo says the HRRR goes with RRFSv2
      # (docs/rrfs-comparison-plan.md); once the default stops matching the
      # HRRR, or starts matching the RRFS, in most of a day's runs, this opens
      # one issue. scripts/defaultModelCheck.ts writes the notice for the
      # first week of a change, so a day this job did not run does not lose
      # it, and the issue is opened only when none with the label has been
      # opened since the change began. On main only: a run dispatched on a
      # branch opens none. Never fails the run: the summary matters more.
      - name: Say if Open-Meteo's default model changed
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          logs=(data/parity/surfacewind-*.jsonl.gz swlogs/*.jsonl)
          [ ${#logs[@]} -gt 0 ] || { echo "no surface-wind records to read"; exit 0; }
          npx tsx scripts/defaultModelCheck.ts --logs "${logs[@]}" --out model-switch.json
          [ -f model-switch.json ] || exit 0
          label=$(jq -r .label model-switch.json)
          since=$(jq -r .since model-switch.json)
          day=$(jq -r .day model-switch.json)
          jq -r .body model-switch.json > model-switch.md
          # The label is how an issue already opened for this change is found.
          if gh label create "$label" --color D93F0B --force --description "$(jq -r .description model-switch.json)"; then
            # A listing that fails opens nothing: tomorrow's run asks again.
            existing=$(gh issue list --label "$label" --state all --search "created:>=$since" --json number --jq '.[0].number // empty') \
              || { echo "::warning::could not list $label issues; not opening one blind"; exit 0; }
            if [ -n "$existing" ]; then
              echo "already raised as #$existing"
            else
              gh issue create --title "$(jq -r .title model-switch.json)" --label "$label" --body-file model-switch.md
            fi
          elif [ "$day" = "$since" ]; then
            # Without the label an earlier issue cannot be found, so only the
            # first day's run opens one.
            echo "::warning::could not create or update label $label; opening the issue without it"
            gh issue create --title "$(jq -r .title model-switch.json)" --body-file model-switch.md
          else
            echo "::warning::could not create or update label $label; an issue is opened without it on the first day only"
          fi
      - name: Combine into the summary
        shell: bash
        run: |
          mkdir -p public/parity
          shopt -s nullglob
          npx tsx scripts/paritySummary.ts logs/*.jsonl > public/parity/summary.json
          head -c 600 public/parity/summary.json; echo
      - name: Commit the summary and archive, and deploy if the summary changed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git add public/parity/summary.json data/parity/parity-logs-*.jsonl.gz data/parity/surfacewind-*.jsonl.gz
          if git diff --cached --quiet; then
            echo "summary and archive unchanged; nothing to commit"
            exit 0
          fi
          summary_changed=$(git diff --cached --quiet -- public/parity/summary.json && echo no || echo yes)
          git config user.name "parity-summary workflow"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Update the source-parity summary ($(date -u +%Y-%m-%d))" \
            -m "Written by .github/workflows/parity-summary.yml from the comparison logs: the summary the #parity page reads, and the records not yet archived (data/parity/parity-logs-*, and the surface-wind sampler's data/parity/surfacewind-<month>)."
          # main moves while the summary is built (a PR merged at 21:13Z on
          # 2026-11-19 had the push rejected, "fetch first", and the day's
          # summary and archive were not committed): rebase onto it and push,
          # up to three times. A conflict (someone else wrote the summary or
          # an archive file meanwhile) fails here, loudly.
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git rebase origin/main
            if git push origin HEAD:main; then break; fi
            echo "push rejected (attempt $attempt); main moved again"
            [ "$attempt" = 3 ] && exit 1
            sleep 10
          done
          # The archive is not part of the site; only a new summary needs a deploy.
          if [ "$summary_changed" = yes ]; then gh workflow run deploy.yml --ref main; fi
