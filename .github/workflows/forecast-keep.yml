name: Forecast keeper

# Every hour, keep what the dashboard's forecasts said: the NWS gridpoint
# fields the card reads and Open-Meteo's 10-day outlook, as the app asks for
# them (scripts/forecastKeep.ts says which and why). Both serve only the
# future, and no archive holds the gridpoint's hourly rain and thunder
# chances or the outlook as the card shows them, so a later comparison
# against what happened needs them kept now (docs/open-questions.md,
# "Forecasts kept for later").
#
# Each snapshot is one gzipped JSON file on the `forecast-archive` branch,
# data/YYYY/MM/DD/HHMMZ.json.gz, committed and pushed as it is taken.
# Nothing reaches `main`, so no deploy runs. Each file's `at` says when it
# was really fetched, so a gap shows as a gap.
#
# One job that loops (scripts/forecastKeepLoop.sh), keeping a snapshot at
# minute 23 of every hour; it stops after its last mark that fits in 340
# minutes, so a run keeps five or six. A cron line per snapshot was
# throttled: GitHub ran `23 * * * *` 10 times in about 47 hours (2026-10-13
# to 15). Scheduled starts of a looping job are throttled too: the
# surface-wind sampler, started every five hours, covered only 57% of the
# time while its starts were late (docs/surface-wind-sources.md). So each
# run first queues its own successor with a workflow_dispatch, which waits
# and begins as this run ends, and the chain does not depend on the
# schedule. The schedule is a backup that restarts the chain if a dispatch
# ever fails; a start it delivers while one is waiting replaces that one
# (listed as cancelled), which loses nothing.
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  # To queue the next run.
  actions: write

# One run at a time, and one waiting: GitHub keeps a single pending run in
# a group and a newer start replaces it.
concurrency:
  group: forecast-keep
  cancel-in-progress: false

jobs:
  keep:
    runs-on: ubuntu-latest
    # The loop's 340 minutes, plus setup; GitHub's ceiling is 360.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Before the loop, so a run that dies part-way still leaves its
      # successor waiting. Only on main: a run dispatched on a branch to try
      # it out keeps one run's snapshots and does not chain.
      - name: Queue the next run
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run forecast-keep.yml --ref main
      - name: Keep a snapshot every hour
        run: scripts/forecastKeepLoop.sh 340
