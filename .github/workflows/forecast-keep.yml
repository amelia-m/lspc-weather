name: Forecast keeper

# Once an hour, keep what the dashboard's forecasts said: the NWS gridpoint
# fields the card reads and Open-Meteo's 10-day outlook, as the app asks for
# them (scripts/forecastKeep.ts says which and why). Both serve only the
# future, and no archive holds the gridpoint's hourly rain and thunder
# chances or the outlook as the card shows them, so a later comparison
# against what happened needs them kept now (docs/open-questions.md,
# "Forecasts kept for later").
#
# Each run commits one gzipped JSON file to the `forecast-archive` branch,
# data/YYYY/MM/DD/HHMMZ.json.gz. Nothing reaches `main`, so no deploy runs.
# A run GitHub skips or delays leaves a gap, and each file's `at` says when
# it was really fetched, so a gap shows as a gap.
on:
  schedule:
    # Minute 23, off the hour's crowd.
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forecast-keep
  cancel-in-progress: false

jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch
        run: |
          stamp=$(date -u +%Y/%m/%d/%H%MZ)
          echo "STAMP=$stamp" >> "$GITHUB_ENV"
          npx tsx scripts/forecastKeep.ts snapshot.json.gz
      - name: Commit to forecast-archive
        run: |
          git config user.name "forecast-keep workflow"
          git config user.email "actions@users.noreply.github.com"
          mv snapshot.json.gz "$RUNNER_TEMP/snapshot.json.gz"
          # The branch holds only the kept files; start it empty the first time.
          if git fetch origin forecast-archive 2>/dev/null; then
            git switch -C forecast-archive FETCH_HEAD
          else
            git switch --orphan forecast-archive
            git rm -rf --quiet . || true
          fi
          mkdir -p "data/$(dirname "$STAMP")"
          cp "$RUNNER_TEMP/snapshot.json.gz" "data/$STAMP.json.gz"
          git add "data/$STAMP.json.gz"
          git commit -m "Keep forecasts ($STAMP)" --quiet
          # Another run may have pushed between fetch and push; rebase once.
          git push origin forecast-archive || { git pull --rebase origin forecast-archive && git push origin forecast-archive; }
