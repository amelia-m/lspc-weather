name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Allow one concurrent deployment; let in-progress runs finish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          # Create/enable the Pages site via the API so no manual
          # Settings → Pages toggle is required (needs pages: write).
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Start the live-site check on the site just deployed. It is started from
  # here rather than by a workflow_run trigger in live-site.yml: a deploy
  # dispatched by another workflow's token (parity-summary.yml daily,
  # ceiling-data-refresh.yml weekly) raised no workflow_run event, so those
  # deploys went unchecked until the next daily run (2026-10-18 16:12Z and
  # 2026-10-19 14:58Z; every deploy from a push was followed). A dispatch
  # made with the token does start a run.
  check-live:
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run live-site.yml --repo "${{ github.repository }}" --ref main -f after_deploy=true
